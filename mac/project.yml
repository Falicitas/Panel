name: Panel
options:
  bundleIdPrefix: com.kinesis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

targets:
  Panel:
    type: application
    platform: macOS
    sources:
      - path: Panel
        excludes:
          - "Resources/editor/**"
      - path: Panel/Resources/editor
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinesis.panel
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # 用本机 keychain 已有的 Developer ID Application 证书签名 — hash 稳定,
        # 不再每次 rebuild 让 TCC (输入监控/辅助功能/麦克风) 重新拉黑。
        # 注: Developer ID 通常用于分发, 这里给 Debug 用是为求 hash 稳定; 本地启动
        # 没 quarantine attr, Gatekeeper 不挡。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Tingzhang Cai (9MA3NPTKD4)"
        DEVELOPMENT_TEAM: "9MA3NPTKD4"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Panel 用麦克风做 F12 全局语音输入 (走 OpenRouter 转写)"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Panel 用本机语音识别把英文音频拆成句子级片段, 用于精听练习"
        CODE_SIGN_ENTITLEMENTS: Panel/Resources/Panel.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
